<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural da Turma</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .descricao {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .lista-alunos {
            list-style: none;
            padding: 0;
        }

        /* Container de cada item da lista */
        .aluno-item {
            background: #fff;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .aluno-item:hover {
            transform: scale(1.02);
        }

        /* Estilização da imagem */
        .aluno-foto {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 20px;
            border: 2px solid #3498db;
        }

        /* Estilização do link */
        .aluno-link {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
            font-size: 1.2em;
        }

        .aluno-link:hover {
            color: #2980b9;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>Mural de Links da Turma</h1>
    <p class="descricao">Cada aluno deve editar o código abaixo para incluir seu nome, link e foto.</p>

    <ul class="lista-alunos">

        <li class="aluno-item">
            <img src="https://via.placeholder.com/60" alt="Foto do Aluno" class="aluno-foto">
            <a href="#" target="_blank" class="aluno-link">Nome do Aluno 1 - Ver Perfil</a>
        </li>


        <li class="aluno-item">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAHslMb6_A13tzR2DW_FtanE_Lns0wYu5iNP2WxuyfKIbCtCezwkhYomujTHBr58Cd_Gmgc7FTj6mCASVSdgHhTSd5SfpRGV3szYwlk3eUnA&s=10"
                alt="Foto do Aluno" class="aluno-foto">
            <a href="https://rmoraes-git.github.io/curriculum" target="_blank" class="aluno-link">Rodrigo Moraes- Ver
                Perfil</a>
        </li>

        <li class="aluno-item">
            <img src="https://imusic.b-cdn.net/images/item/original/461/5055339797461.jpg?avenged-sevenfold-2020-avenged-sevenfold-back-patch-distressed-skull-merch&class=original&v=1722921248"
                alt="Foto do Aluno" class="aluno-foto">
            <a href="https://github.com/ArthurRhein/Curriculum" target="_blank" class="aluno-link">Arthur Rheinheimer -
                Ver Perfil</a>
        </li>

        <li class="aluno-item">
            <img src="https://noticiasdatv.uol.com.br/media/_versions/artigos_2024/usa-network-suits-patrick-j-adams_fixed_large.jpg"
                alt="Foto do Esthevan" class="aluno-foto">
            <a href="https://esthevan19.github.io/Curriculo/" target="_blank" class="aluno-link">
                Esthevan Silva - Ver Perfil
            </a>
        </li>
        <li class="aluno-item">
            <img src="https://stock.adobe.com/br/search?k=nerd" alt="Foto do Aluno" class="aluno-foto">
            <a href="https://murilo-28.github.io/Curriculum/" target="_blank" class="aluno-link">Murilo Casagrande - Ver
                Perfil</a>
        </li>


    </ul>

</body>

</html>
